<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Game Changers – FIFA World Cup 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--surf:#0d1320;--card:#111b2e;--card2:#162035;
  --b:rgba(255,255,255,.08);--b2:rgba(255,255,255,.13);
  --acc:#00d4ff;--gold:#ffd700;--grn:#22c55e;--red:#ef4444;--orn:#f97316;--pur:#a78bfa;
  --txt:#e2e8f0;--sub:#7fa8c0;--dim:#3d5a6e;--navy:#0a1628;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;font-size:14px}
/* ── Layout */
#app{display:flex;flex-direction:column;min-height:100vh}
.hdr{background:var(--navy);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:200;height:56px;display:flex;align-items:center;padding:0 20px;gap:12px}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-right:16px;text-decoration:none}
.logo-icon{font-size:22px}
.logo-text{font-family:'Syne',sans-serif;font-size:16px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--txt)}
.logo-text span{color:var(--acc)}
.logo-sub{font-size:9px;color:var(--dim);letter-spacing:1.5px;line-height:1;margin-top:2px}
nav{display:flex;flex:1;overflow-x:auto;gap:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--sub);padding:6px 14px 4px;cursor:pointer;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all .15s;flex-shrink:0}
nav button.active{color:var(--acc);border-bottom-color:var(--acc)}
nav button:hover:not(.active){color:var(--txt)}
.hdr-user{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hdr-avatar{font-size:18px;cursor:pointer}
.hdr-name{font-size:13px;font-weight:600;color:var(--txt)}
.main{flex:1;max-width:1160px;margin:0 auto;width:100%;padding:22px 20px}
/* ── Auth */
.auth-wrap{display:flex;min-height:600px;flex-direction:column;position:relative;overflow:hidden}
.auth-bg{position:absolute;inset:0;z-index:0;background-image:url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1400&q=80&auto=format&fit=crop');background-size:cover;background-position:center 30%}
.auth-bg-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(160deg,rgba(6,11,20,.93) 0%,rgba(10,22,40,.88) 40%,rgba(7,9,15,.95) 100%)}
.auth-left{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 32px 20px;position:relative;z-index:2;overflow:hidden}
.auth-left::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;border:1px solid rgba(0,212,255,.05);top:-200px;left:50%;transform:translateX(-50%)}
.auth-left::after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;border:1px solid rgba(0,212,255,.04);bottom:-100px;right:10%}
.auth-brand{text-align:center;position:relative;z-index:1;max-width:680px;margin:0 auto}
.auth-divider{width:60px;height:3px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.4),transparent);margin:20px auto 0;border-radius:3px}
.auth-logo{font-size:52px;margin-bottom:8px;filter:drop-shadow(0 0 20px rgba(0,212,255,.3))}
.auth-title{font-family:'Syne',sans-serif;font-size:34px;font-weight:900;letter-spacing:4px;text-transform:uppercase;line-height:1.1;color:var(--txt)}
.auth-title span{color:var(--acc)}
.auth-tagline{font-size:13px;color:var(--sub);margin-top:8px;letter-spacing:1px}
.auth-stats{display:flex;gap:28px;justify-content:center;margin-top:20px}
.auth-stat{text-align:center}
.auth-stat-n{font-family:'DM Mono',monospace;font-size:26px;font-weight:700;color:var(--acc)}
.auth-stat-l{font-size:10px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.auth-flags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:500px;margin:16px auto 0;font-size:30px;line-height:1}
.auth-right{width:100%;max-width:420px;background:rgba(11,17,30,.92);backdrop-filter:blur(16px);border-radius:20px;border:1px solid var(--b2);display:flex;flex-direction:column;justify-content:center;padding:32px 32px;margin:0 auto 40px;box-shadow:0 0 60px rgba(0,212,255,.08);position:relative;z-index:2}
.auth-form-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--txt);margin-bottom:4px}
.auth-form-sub{font-size:13px;color:var(--sub);margin-bottom:22px}
.mode-tabs{display:flex;background:rgba(255,255,255,.05);border-radius:10px;padding:3px;margin-bottom:20px}
.mode-tab{flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:13px;font-family:'DM Sans',sans-serif;transition:all .15s;background:transparent;color:var(--sub)}
.mode-tab.active{background:var(--acc);color:#07090f}
.field-label{display:block;font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.8px;margin-bottom:5px;margin-top:12px;text-transform:uppercase}
.field-input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:var(--txt);padding:11px 14px;font-size:13px;width:100%;outline:none;font-family:'DM Sans',sans-serif;transition:border-color .15s}
.field-input:focus{border-color:var(--acc)}
.field-input option{background:#111b2e;color:var(--txt)}
.auth-submit{background:var(--acc);color:#07090f;border:none;border-radius:10px;width:100%;padding:13px;font-size:14px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:18px;transition:all .15s}
.auth-submit:hover{background:#00bde0}
.auth-hint{margin-top:12px;padding:8px 12px;background:rgba(0,212,255,.05);border-radius:8px;font-size:11px;color:var(--dim);text-align:center}
.err-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:9px;padding:9px 14px;color:var(--red);font-size:12px;margin-bottom:12px}
.ok-box{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);border-radius:9px;padding:9px 14px;color:var(--grn);font-size:12px;margin-bottom:12px}
/* ── Cards */
.card{background:var(--card);border-radius:14px;border:1px solid var(--b);padding:16px 18px}
.card-accent{border-color:rgba(0,212,255,.25)}
.hero-card{background:linear-gradient(135deg,var(--navy) 0%,#0d1f3a 60%,#070c14 100%);border:1px solid rgba(0,212,255,.18)}
/* ── Buttons */
.btn{padding:9px 18px;border-radius:9px;border:none;cursor:pointer;font-weight:700;font-size:13px;font-family:'DM Sans',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--acc);color:#07090f}
.btn-primary:hover{background:#00bde0}
.btn-gold{background:var(--gold);color:#07090f}
.btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--b)}
.btn-ghost:hover{border-color:var(--b2);color:var(--txt)}
.btn-success{background:rgba(34,197,94,.12);color:var(--grn);border:1px solid rgba(34,197,94,.25)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.btn-outline{background:rgba(0,212,255,.08);color:var(--acc);border:1px solid rgba(0,212,255,.25)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:7px}
/* ── Chips */
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.4px}
.chip-cyan{background:rgba(0,212,255,.12);color:var(--acc)}
.chip-gold{background:rgba(255,215,0,.12);color:var(--gold)}
.chip-green{background:rgba(34,197,94,.12);color:var(--grn)}
.chip-red{background:rgba(239,68,68,.12);color:var(--red)}
.chip-orange{background:rgba(249,115,22,.12);color:var(--orn)}
.chip-purple{background:rgba(167,139,250,.12);color:var(--pur)}
/* ── Grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:700px){.g4{grid-template-columns:repeat(2,1fr)}.g5{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr}.auth-right{max-width:100%;margin:0 16px 32px;padding:24px 20px}.auth-title{font-size:26px}.main{padding:14px 12px}}
/* ── Match card */
.match-card{position:relative;overflow:hidden;transition:border-color .2s,background .2s;cursor:default}
.match-card:hover{background:var(--card2)}
.match-top-bar{position:absolute;top:0;left:0;right:0;height:3px}
.teams-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.team-side{flex:1;text-align:center}
.team-flag{font-size:52px;display:block;margin-bottom:6px;line-height:1;font-style:normal;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
.team-name{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--txt);margin-top:3px}
.team-code{font-family:'DM Mono',monospace;font-size:10px;color:var(--sub);letter-spacing:2px;margin-top:2px;display:none}
.vs-col{text-align:center;padding:0 10px;flex-shrink:0}
.vs-text{font-family:'Syne',sans-serif;font-size:20px;font-weight:900;color:var(--acc);letter-spacing:3px;display:block;text-shadow:0 0 15px rgba(0,212,255,.3);margin-bottom:4px}
.match-time{font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);margin-top:3px}
.match-city{font-size:10px;color:var(--dim);margin-top:1px}
.match-venue{font-size:10px;color:var(--dim);text-align:center;margin-bottom:10px}
/* ── Countdown */
.countdown{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.cd-box{background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.15);border-radius:8px;padding:5px 8px;text-align:center;min-width:44px}
.cd-num{font-family:'DM Mono',monospace;font-size:16px;font-weight:700;color:var(--acc);line-height:1;display:block}
.cd-lbl{font-size:8px;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;margin-top:2px;display:block}
.cd-live{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:var(--red);font-size:12px;font-weight:700;padding:6px 14px;border-radius:8px;text-align:center;width:100%;animation:pulse 1.5s infinite}
.cd-closed{font-size:11px;color:var(--dim);text-align:center;padding:4px 0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
/* ── Progress bar */
.prog-wrap{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--grn));transition:width .4s}
/* ── Score tag */
.stag{font-family:'DM Mono',monospace;font-weight:700;font-size:13px;padding:3px 10px;border-radius:7px;display:inline-block}
.stag-pos{background:rgba(34,197,94,.1);color:var(--grn)}
.stag-neg{background:rgba(239,68,68,.1);color:var(--red)}
.stag-zero{background:rgba(255,255,255,.06);color:var(--sub)}
/* ── Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-box{background:var(--card);border-radius:18px;border:1px solid var(--b2);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 0 60px rgba(0,212,255,.07)}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--b)}
.modal-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--txt)}
.modal-body{padding:22px 24px}
/* ── Table */
.data-table{width:100%;border-collapse:collapse;font-family:'DM Sans',sans-serif}
.data-table th{padding:10px 14px;text-align:left;font-size:10px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.8px;background:rgba(0,212,255,.05);white-space:nowrap}
.data-table td{padding:11px 14px;border-top:1px solid var(--b)}
.data-table tr:hover td{background:rgba(255,255,255,.02)}
/* ── Leaderboard */
.lb-me td{background:rgba(0,212,255,.04)!important}
/* ── Option pills (prediction) */
.opt-row{display:flex;gap:7px;flex-wrap:wrap}
.opt-btn{padding:7px 14px;border-radius:9px;border:1px solid var(--b);background:rgba(255,255,255,.02);color:var(--sub);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .13s}
.opt-btn:hover{border-color:var(--acc);color:var(--txt)}
.opt-btn.selected{border-color:var(--acc);background:rgba(0,212,255,.13);color:var(--acc);font-weight:700;box-shadow:0 0 8px rgba(0,212,255,.15)}
.opt-btn-sim.selected{border-color:var(--grn);background:rgba(34,197,94,.13);color:var(--grn);font-weight:700}
/* ── Avatar picker */
.av-grid{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}
.av-btn{width:36px;height:36px;border-radius:10px;border:2px solid var(--b);background:rgba(255,255,255,.03);cursor:pointer;font-size:17px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.av-btn.active{border-color:var(--acc);background:rgba(0,212,255,.12)}
/* ── Filter bar */
.filter-bar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;background:rgba(255,255,255,.03);border-radius:10px;padding:5px;margin-bottom:16px}
.filter-btn{padding:5px 12px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;transition:all .15s;background:transparent;color:var(--sub)}
.filter-btn.active-cyan{background:var(--acc);color:#07090f}
.filter-btn.active-green{background:var(--grn);color:#07090f}
.filter-divider{width:1px;height:20px;background:var(--b);margin:0 2px}
/* ── Misc */
.section-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--txt);margin-bottom:4px}
.section-sub{font-size:12px;color:var(--sub);margin-bottom:18px}
.empty-state{text-align:center;padding:52px 20px;color:var(--dim)}
.empty-icon{font-size:44px;margin-bottom:12px}
.empty-text{font-size:14px}
.divider{height:1px;background:var(--b);margin:14px 0}
.flag-sm{font-size:11px;margin-right:3px}
/* ── Notification toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#22c55e;color:#07090f;padding:10px 22px;border-radius:30px;font-weight:700;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

.verify-box{text-align:center;padding:32px 20px}
.verify-icon{font-size:56px;margin-bottom:16px;display:block}
.verify-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--txt);margin-bottom:8px}
.verify-sub{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:20px}
.verify-email{display:inline-block;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.25);border-radius:8px;padding:6px 16px;color:var(--acc);font-weight:700;font-size:13px;margin-bottom:20px}
.verify-resend{background:transparent;border:none;color:var(--sub);font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;margin-top:8px}
.verify-resend:hover{color:var(--acc)}

</style>

var QUESTIONS=function(h,a,hc,ac){
  var hn=hc||h, an=ac||a;
  var hStars=getStars(h), aStars=getStars(a);
  var hS1=hStars[0]||hn, aS1=aStars[0]||an;
  var hS2=hStars[1]||hn, aS2=aStars[1]||an;

  // Score combos with team abbreviations — avoids confusion
  var scores=[
    hn+" 1-0","1-1 Draw","0-1 "+an,
    hn+" 2-0",hn+" 2-1",
    "1-2 "+an,"0-2 "+an,
    hn+" 3-1","1-3 "+an,
    "2-2 Draw","Other"
  ];
  // Pick 5 varied score options for Q8
  var scoreOpts=[scores[0],scores[1],scores[2],scores[3],scores[10]];

  // Q9 variant — rotate based on team name char code for variety per match
  var seed=(h.charCodeAt(0)+a.charCodeAt(0))%4;
  var q9,q9opts;
  if(seed===0){
    q9="Total corners in the match?";q9opts=["0-4","5-8","9-12","13+"];
  } else if(seed===1){
    q9="Will both teams score (BTTS)?";q9opts=["Yes","No"];
  } else if(seed===2){
    q9="Will the match go to extra time?";q9opts=["Yes","No"];
  } else {
    q9="Winning margin?";q9opts=["1 goal","2 goals","3+ goals","Draw"];
  }

  // Q10 variant
  var seed2=(h.charCodeAt(1)+a.charCodeAt(1))%4;
  var q10,q10opts;
  if(seed2===0){
    q10="Total yellow cards?";q10opts=["0-1","2-3","4-5","6+"];
  } else if(seed2===1){
    q10="Man of the Match team?";q10opts=[hn,an];
  } else if(seed2===2){
    q10="Will there be a VAR decision?";q10opts=["Yes","No"];
  } else {
    q10="Goals in first 15 minutes?";q10opts=["Yes - "+hn,"Yes - "+an,"No goals"];
  }

  return[
    {id:1, q:"Who will win?",                           o:[hn,"Draw",an]},
    {id:2, q:"Total goals in the match?",               o:["0-1","2-3","4-5","6+"]},
    {id:3, q:"Who scores first?",                       o:[hn,an,"No goals"]},
    {id:4, q:"Will "+hS1+" score?",                     o:["Yes","No"]},
    {id:5, q:"Will "+aS1+" score?",                     o:["Yes","No"]},
    {id:6, q:"Red card in the match?",                  o:["Yes","No"]},
    {id:7, q:"Penalty kick awarded?",                   o:["Yes","No"]},
    {id:8, q:"More goals in which half?",               o:["1st Half","2nd Half","Equal"]},
    {id:9, q:q9,                                        o:q9opts},
    {id:10,q:"Correct scoreline?",                      o:scoreOpts}
  ];
};

function getScore(uid){
  var preds=ld("preds")||{},results=ld("results")||{},tot=0,cor=0,wrg=0,pen=0;
  Object.keys(preds).forEach(function(k){
    var p=k.split("_");if(p[0]!==uid)return;
    var res=results[p[1]];
    if(!res){pen++;return;}
    var ua=preds[k];
    Object.keys(ua).forEach(function(qi){if(res[qi]===ua[qi]){tot+=5;cor++;}else{tot-=3;wrg++;}});
  });
  return{tot:tot,cor:cor,wrg:wrg,pen:pen};
}

function localMatchTime(utcStr){
  // Returns local date/time string based on user's browser timezone
  var d=new Date(utcStr);
  var dateStr=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  var timeStr=d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',hour12:true});
  var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"";
  var tzShort=tz.split('/').pop().replace(/_/g,' ');
  return {date:dateStr,time:timeStr,tz:tzShort,full:dateStr+' · '+timeStr};
}
function getCountdown(utcStr){
  var now=Date.now();
  var kick=new Date(utcStr).getTime();
  var open=kick-24*60*60*1000; // predictions open 24h before
  var diff=kick-now;
  if(diff<=0)return{state:'past'};
  if(now<open)return{state:'closed',hoursUntilOpen:Math.ceil((open-now)/3600000)};
  // Within prediction window
  var h=Math.floor(diff/3600000);
  var m=Math.floor((diff%3600000)/60000);
  var s=Math.floor((diff%60000)/1000);
  return{state:'open',h:h,m:m,s:s,diff:diff};
}

  var e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(function(a){
    if(a[0]==='cls')e.className=a[1];
    else if(a[0]==='style')Object.assign(e.style,a[1]);
    else if(a[0].startsWith('on'))e[a[0]]=a[1];
    else e.setAttribute(a[0],a[1]);
  });
  if(innerHTML!==undefined)e.innerHTML=innerHTML;
  return e;
}

function makeCountdown(match,isPredicted){
  var wrap=h('div',null);
  var cd=getCountdown(match.utc);
  if(cd.state==='past'){
    var p=h('div',{cls:'cd-closed'});p.textContent=isPredicted?'✓ Predicted — awaiting result':'Match has started — predictions closed';wrap.appendChild(p);return wrap;
  }
  if(cd.state==='closed'){
    var p2=h('div',{cls:'cd-closed'});p2.textContent='Predictions open in '+cd.hoursUntilOpen+'h (24h before kickoff)';wrap.appendChild(p2);return wrap;
  }
  // Open — live countdown
  var cdWrap=h('div',{cls:'countdown'});cdWrap.id='cd-'+match.id;
  function update(){
    var c=getCountdown(match.utc);
    if(c.state!=='open'){render();return;}
    cdWrap.innerHTML='';
    [{v:c.h,l:'HRS'},{v:c.m,l:'MIN'},{v:c.s,l:'SEC'}].forEach(function(x){
      var box=h('div',{cls:'cd-box'});
      box.innerHTML='<span class="cd-num">'+String(x.v).padStart(2,'0')+'</span><span class="cd-lbl">'+x.l+'</span>';
      cdWrap.appendChild(box);
    });
  }
  update();
  var tid=setInterval(update,1000);
  cdTimers[match.id]=tid;
  wrap.appendChild(cdWrap);
  return wrap;
}

// MATCH CARD
// ═══════════════════════════════════════════════════
function makeMatchCard(match,opts){
  var pub=ld('pub')||[],preds=ld('preds')||{},results=ld('results')||{};
  var admin=S.user.role==='admin';
  var isPred=!!preds[S.user.id+'_'+match.id];
  var hasRes=!!results[match.id];
  var isP=pub.indexOf(match.id)>=0;
  var ht=gt(match.h),at=gt(match.a);
  var lmt=localMatchTime(match.utc);
  var mc=card('match-card'+(isPred?' card-accent':''));

  // Top gradient bar
  if(isPred||hasRes){
    var bar=h('div',{cls:'match-top-bar'});
    bar.style.background=isPred?'linear-gradient(90deg,#22c55e,#00d4ff)':'linear-gradient(90deg,#a78bfa,#00d4ff)';
    mc.appendChild(bar);
  }

  // Badges row
  var brow=h('div',{style:{marginBottom:'10px',display:'flex',gap:'5px',flexWrap:'wrap',alignItems:'center'}});
  brow.appendChild(chip('Grp '+match.g,'chip-cyan'));
  if(isPred)brow.appendChild(chip('✓ Predicted','chip-green'));
  if(hasRes)brow.appendChild(chip('Simulated','chip-purple'));
  if(isP&&!admin)brow.appendChild(chip('Open','chip-green'));
  mc.appendChild(brow);

  // Teams
  var teams=h('div',{cls:'teams-row'});
  function teamSide(team,name){
    var td=h('div',{cls:'team-side'});
    // Large flag — no 2-letter code
    var flagEl=h('span',{cls:'team-flag'});
    flagEl.textContent=team.f;
    td.appendChild(flagEl);
    td.appendChild(h('div',{cls:'team-name'},name));
    // 3-letter FIFA code shown small below name
    var codeEl=h('div',{cls:'team-code'});
    codeEl.textContent=team.c;
    codeEl.style.fontSize='11px';
    codeEl.style.letterSpacing='2px';
    td.appendChild(codeEl);
    return td;
  }
  teams.appendChild(teamSide(ht,match.h));
  var vs=h('div',{cls:'vs-col'});
  vs.appendChild(h('span',{cls:'vs-text'},'VS'));
  vs.appendChild(h('div',{cls:'match-time'},lmt.time));
  vs.appendChild(h('div',{cls:'match-city'},lmt.date));
  teams.appendChild(vs);
  teams.appendChild(teamSide(at,match.a));
  mc.appendChild(teams);

  // Local time & timezone info
  var timeInfo=h('div',{style:{textAlign:'center',fontSize:'11px',color:'var(--sub)',marginBottom:'6px'}});
  timeInfo.innerHTML='📅 <b style="color:var(--txt)">'+lmt.full+'</b> <span style="color:var(--dim)">'+lmt.tz+'</span>';
  mc.appendChild(timeInfo);

  // Venue
  mc.appendChild(h('div',{cls:'match-venue'},'📍 '+match.v+', '+match.city));

  // Countdown
  if(!admin)mc.appendChild(makeCountdown(match,isPred));

  // Actions
  var arow=h('div',{style:{display:'flex',gap:'7px',marginTop:'8px'}});
  if(!admin&&isP){
    var pb=btn(isPred?'✏ Edit Prediction':'🔮 Predict Now',isPred?'btn-outline btn-sm':'btn-primary btn-sm',
      function(){ss({modal:{type:'predict',match:match,answers:Object.assign({},(ld('preds')||{})[S.user.id+'_'+match.id]||{})}});});
    pb.style.flex='1';
    arow.appendChild(pb);
  }
  if(!admin&&!isP){
    var cs=h('div',{style:{textAlign:'center',color:'var(--dim)',fontSize:'11px',padding:'6px 0',flex:'1'}});
    cs.textContent='⏳ Predictions not open yet';
    arow.appendChild(cs);
  }
  if(admin){
    var tpb=btn(isP?'Unpublish':'Publish',isP?'btn-danger btn-sm':'btn-success btn-sm',function(){
      var p2=ld('pub')||[];
      var np=isP?p2.filter(function(x){return x!==match.id;}):[].concat(p2,[match.id]);
      sv('pub',np);toast(isP?'Unpublished':'✓ Published!',isP?'#ef4444':'#22c55e');render();
    });
    tpb.style.flex='1';arow.appendChild(tpb);
    var sb2=btn(hasRes?'✏ Edit Sim':'▶ Simulate','btn-outline btn-sm',function(){
      ss({modal:{type:'simulate',match:match,answers:Object.assign({},(ld('results')||{})[match.id]||{})}});
    });arow.appendChild(sb2);
  }
  mc.appendChild(arow);
  return mc;
}

// ═══════════════════════════════════════════════════
// MODAL (predict / simulate)
// ═══════════════════════════════════════════════════
function renderModal(){
  var mo=S.modal,m=mo.match,type=mo.type;
  var qs=QUESTIONS(m.h,m.a,gt(m.h).c,gt(m.a).c);
  var isPred=(type==='predict');
  var ht=gt(m.h),at=gt(m.a);
  var lmt=localMatchTime(m.utc);

  // Use a plain object to track answers — NOT S.modal (avoids stale closure issues)
  var ANS = Object.assign({}, mo.answers||{});

  var overlay=h('div',{cls:'modal-overlay'});
  overlay.onclick=function(e){if(e.target===overlay)ss({modal:null});};
  var box=h('div',{cls:'modal-box'});

  // ── Header
  var hdr2=h('div',{cls:'modal-hdr'});
  hdr2.appendChild(h('div',{cls:'modal-title'},(isPred?'🔮 ':'▶ ')+m.h+' vs '+m.a));
  var xb=btn('✕','btn-ghost btn-xs',function(){ss({modal:null});});
  hdr2.appendChild(xb);box.appendChild(hdr2);

  var body=h('div',{cls:'modal-body'});

  // ── Match banner
  var ban=h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 14px',background:'rgba(0,212,255,.05)',borderRadius:'12px',border:'1px solid rgba(0,212,255,.15)',marginBottom:'16px'}});
  function tbanner(team){
    var td=h('div',{style:{textAlign:'center'}});
    var codeEl=h('div',{style:{fontFamily:"'Syne',sans-serif",fontSize:'32px',fontWeight:'900',color:'var(--txt)',letterSpacing:'2px',lineHeight:'1'}},team.c);
    td.appendChild(codeEl);
    var nameEl=h('div',{style:{fontSize:'11px',color:'var(--sub)',marginTop:'5px',fontWeight:'600'}},team.n);
    td.appendChild(nameEl);
    return td;
  }
  ban.appendChild(tbanner(ht));
  var vsmid=h('div',{style:{textAlign:'center'}});
  vsmid.appendChild(h('div',{style:{fontFamily:"'Syne',sans-serif",fontSize:'20px',fontWeight:'900',color:'var(--acc)',letterSpacing:'3px'}},'VS'));
  vsmid.appendChild(h('div',{style:{fontSize:'10px',color:'var(--dim)',marginTop:'4px'}},lmt.full+' '+lmt.tz));
  ban.appendChild(vsmid);
  ban.appendChild(tbanner(at));
  body.appendChild(ban);

  // ── Scoring info (predict mode only)
  var doneCountEl=null, progFillEl=null;
  if(isPred){
    var si=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:'14px'}});
    [['+5','Correct','#22c55e','rgba(34,197,94,.08)'],['-3','Wrong','#ef4444','rgba(239,68,68,.08)'],['0/10','Done','#00d4ff','rgba(0,212,255,.08)']].forEach(function(it){
      var sc2=h('div',{style:{background:it[3],borderRadius:'9px',padding:'8px',textAlign:'center'}});
      var vd=h('div',{style:{fontSize:'18px',fontWeight:'900',fontFamily:"'DM Mono',monospace",color:it[2]}},it[0]);
      sc2.appendChild(vd);
      sc2.appendChild(h('div',{style:{fontSize:'10px',color:'var(--sub)'}},it[1]));
      if(it[1]==='Done') doneCountEl=vd;
      si.appendChild(sc2);
    });
    body.appendChild(si);
    var pg=h('div',{cls:'prog-wrap',style:{marginBottom:'16px'}});
    progFillEl=h('div',{cls:'prog-fill'});
    progFillEl.style.width='0%';
    pg.appendChild(progFillEl);
    body.appendChild(pg);
  }else{
    body.appendChild(h('div',{style:{background:'rgba(34,197,94,.07)',border:'1px solid rgba(34,197,94,.2)',borderRadius:'9px',padding:'9px 13px',fontSize:'12px',color:'var(--grn)',marginBottom:'14px'}},'Set the correct answers. User scores update automatically (+5 / −3).'));
  }

  // ── Save button (created early so refreshBtn can reference it)
  var saveBtn=document.createElement('button');
  Object.assign(saveBtn.style,{padding:'10px 24px',borderRadius:'9px',border:'none',cursor:'pointer',fontWeight:'700',fontSize:'13px',fontFamily:"'DM Sans',sans-serif",transition:'all .15s'});

  // ── Central refresh function — reads ANS directly, updates ALL UI
  function refreshUI(){
    var done=qs.filter(function(q){return ANS[q.id]!==undefined;}).length;
    // Progress bar & count
    if(progFillEl) progFillEl.style.width=(done/10*100)+'%';
    if(doneCountEl) doneCountEl.textContent=done+'/10';
    // Save button
    if(done===10){
      saveBtn.textContent=isPred?'Save Prediction ✓':'Save Results ✓';
      saveBtn.style.background=isPred?'var(--acc)':'var(--grn)';
      saveBtn.style.color='#07090f';
    } else {
      saveBtn.textContent=(10-done)+' more..';
      saveBtn.style.background='rgba(255,255,255,.06)';
      saveBtn.style.color='var(--dim)';
    }
  }

  // ── Questions
  qs.forEach(function(q,i){
    var qw=h('div',{style:{marginBottom:'15px'}});
    var qh=h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px',fontSize:'13px',fontWeight:'700',color:'var(--sub)'}});
    var numBubble=h('span',{style:{width:'20px',height:'20px',borderRadius:'50%',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:'10px',fontWeight:'800',fontFamily:"'DM Mono',monospace",flexShrink:'0',background:'rgba(255,255,255,.07)',color:'var(--dim)'}},String(i+1));
    qh.appendChild(numBubble);
    qh.appendChild(document.createTextNode(q.q));
    qw.appendChild(qh);

    var optRow=h('div',{cls:'opt-row'});
    q.o.forEach(function(opt){
      var ob=h('button',{cls:'opt-btn'});
      ob.textContent=opt;
      // Set initial selected state if answer already exists
      if(ANS[q.id]===opt){
        ob.classList.add(isPred?'selected':'opt-btn-sim');
        ob.classList.add(isPred?'selected':'selected');
        numBubble.style.background=isPred?'var(--acc)':'var(--grn)';
        numBubble.style.color='#07090f';
        qh.style.color='var(--txt)';
      }
      ob.onclick=function(){
        // 1. Store answer in local ANS object
        ANS[q.id]=opt;
        // 2. Also sync to S.modal so state is preserved
        if(S.modal) S.modal.answers=Object.assign({},ANS);
        // 3. Update all buttons in this row
        optRow.querySelectorAll('.opt-btn').forEach(function(b){
          b.className='opt-btn';
        });
        ob.classList.add('selected');
        if(!isPred) ob.classList.add('opt-btn-sim');
        // 4. Update question header
        numBubble.style.background=isPred?'var(--acc)':'var(--grn)';
        numBubble.style.color='#07090f';
        qh.style.color='var(--txt)';
        // 5. Refresh save button + progress
        refreshUI();
      };
      optRow.appendChild(ob);
    });
    qw.appendChild(optRow);
    body.appendChild(qw);
  });

  // ── Footer
  var ft=h('div',{style:{borderTop:'1px solid var(--b)',paddingTop:'14px',display:'flex',gap:'9px',justifyContent:'flex-end',marginTop:'8px'}});
  ft.appendChild(btn('Cancel','btn-ghost',function(){ss({modal:null});}));

  saveBtn.onclick=function(){
    var done=qs.filter(function(q){return ANS[q.id]!==undefined;}).length;
    if(done<10){toast('Please answer all '+(10-done)+' remaining question(s)','#f97316');return;}
    if(isPred){
      var p=ld('preds')||{};
      p[S.user.id+'_'+m.id]=Object.assign({},ANS);
      sv('preds',p);
      toast('✓ Prediction saved!');
    } else {
      var r=ld('results')||{};
      r[m.id]=Object.assign({},ANS);
      sv('results',r);
      toast('✓ Results saved!');
    }
    ss({modal:null});
  };
  ft.appendChild(saveBtn);
  body.appendChild(ft);
  box.appendChild(body);
  overlay.appendChild(box);

  // Initial UI refresh (handles pre-filled answers)
  refreshUI();

  return overlay;
}

// MATCHES PAGE
// ═══════════════════════════════════════════════════════════════════════════════
function matchesPage(){
  var admin=S.user.role==='admin';
  var pub=ld('pub')||[],preds=ld('preds')||{},results=ld('results')||{};
  // Users only see groups that have published matches
  // Admins see all groups
  var relevantMatches = admin ? MATCHES : MATCHES.filter(function(m){return pub.indexOf(m.id)>=0;});
  var allGroups=['all'];
  relevantMatches.forEach(function(m){if(allGroups.indexOf(m.g)<0)allGroups.push(m.g);});
  allGroups.sort(function(a,b){return a==='all'?-1:a.localeCompare(b);});
  var wrap=h('div',null);

  // Header row
  var hrow=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'16px'}});
  var ht2=h('div',null);
  ht2.appendChild(h('div',{cls:'section-title'},'Match Predictions'));
  ht2.appendChild(h('div',{cls:'section-sub'},admin?pub.length+'/'+MATCHES.length+' published · Times in your local timezone':'+5 correct · −3 wrong · Times in your local timezone'));
  hrow.appendChild(ht2);
  if(admin){
    var pab=btn('Publish All '+MATCHES.length,'btn-success',function(){
      sv('pub',MATCHES.map(function(m){return m.id;}));
      toast('All '+MATCHES.length+' matches published!');
      render();
    });
    hrow.appendChild(pab);
  }
  wrap.appendChild(hrow);

  // Filter bar — group tabs only shown for groups with relevant matches
  var fb=h('div',{cls:'filter-bar'});
  // Only show group tabs if there are published matches (users) or all matches (admin)
  if(admin || pub.length>0){
    allGroups.forEach(function(g){
      var act=S.gf===g;
      var gb=h('button',{cls:'filter-btn'+(act?' active-cyan':'')});
      gb.textContent=g==='all'?'All':'Grp '+g;
      gb.onclick=(function(gv){return function(){ss({gf:gv});};})(g);
      fb.appendChild(gb);
    });
  }
  if(!admin){
    fb.appendChild(h('div',{cls:'filter-divider'}));
    [['all','All'],['open','Open'],['done','Done']].forEach(function(fv){
      var act=S.mf===fv[0];
      var gb2=h('button',{cls:'filter-btn'+(act?' active-green':'')});
      gb2.textContent=fv[1];
      gb2.onclick=(function(fk){return function(){ss({mf:fk});};})(fv[0]);
      fb.appendChild(gb2);
    });
  }
  wrap.appendChild(fb);

  // Filter matches
  var vis=MATCHES.filter(function(m){return S.gf==='all'||m.g===S.gf;});
  if(!admin){
    vis=vis.filter(function(m){return pub.indexOf(m.id)>=0;});
    if(S.mf==='done')vis=vis.filter(function(m){return!!preds[S.user.id+'_'+m.id];});
    if(S.mf==='open')vis=vis.filter(function(m){return!preds[S.user.id+'_'+m.id];});
  }

  if(vis.length===0){
    var es=h('div',{cls:'card empty-state'});
    es.innerHTML='<div class="empty-icon">⏳</div><div class="empty-text">'+(pub.length===0&&!admin?'No matches published yet — check back soon!':'No matches in this filter.')+'</div>';
    wrap.appendChild(es);
    return wrap;
  }

  var grid=h('div',{cls:'g3'});
  vis.forEach(function(m){grid.appendChild(makeMatchCard(m,{}));});
  wrap.appendChild(grid);
  return wrap;
}


function simPage(){
