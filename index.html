<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--surf:#0d1320;--card:#111b2e;--card2:#162035;
  --b:rgba(255,255,255,.08);--b2:rgba(255,255,255,.13);
  --acc:#00d4ff;--gold:#ffd700;--grn:#22c55e;--red:#ef4444;--orn:#f97316;--pur:#a78bfa;
  --txt:#e2e8f0;--sub:#7fa8c0;--dim:#3d5a6e;--navy:#0a1628;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;font-size:14px}
/* ── Layout */
#app{display:flex;flex-direction:column;min-height:100vh}
.hdr{background:var(--navy);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:200;height:56px;display:flex;align-items:center;padding:0 20px;gap:12px}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-right:16px;text-decoration:none}
.logo-icon{font-size:22px}
.logo-text{font-family:'Syne',sans-serif;font-size:16px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--txt)}
.logo-text span{color:var(--acc)}
.logo-sub{font-size:9px;color:var(--dim);letter-spacing:1.5px;line-height:1;margin-top:2px}
nav{display:flex;flex:1;overflow-x:auto;gap:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--sub);padding:6px 14px 4px;cursor:pointer;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all .15s;flex-shrink:0}
nav button.active{color:var(--acc);border-bottom-color:var(--acc)}
nav button:hover:not(.active){color:var(--txt)}
.hdr-user{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hdr-avatar{font-size:18px;cursor:pointer}
.hdr-name{font-size:13px;font-weight:600;color:var(--txt)}
.main{flex:1;max-width:1160px;margin:0 auto;width:100%;padding:22px 20px}

.auth-bg-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(160deg,rgba(6,11,20,.93) 0%,rgba(10,22,40,.88) 40%,rgba(7,9,15,.95) 100%)}
.auth-left{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 32px 20px;position:relative;z-index:2;overflow:hidden}
.auth-left::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;border:1px solid rgba(0,212,255,.05);top:-200px;left:50%;transform:translateX(-50%)}
.auth-left::after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;border:1px solid rgba(0,212,255,.04);bottom:-100px;right:10%}
.auth-brand{text-align:center;position:relative;z-index:1;max-width:680px;margin:0 auto}
.auth-divider{width:60px;height:3px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.4),transparent);margin:20px auto 0;border-radius:3px}
.auth-logo{font-size:52px;margin-bottom:8px;filter:drop-shadow(0 0 20px rgba(0,212,255,.3))}
.auth-title{font-family:'Syne',sans-serif;font-size:34px;font-weight:900;letter-spacing:4px;text-transform:uppercase;line-height:1.1;color:var(--txt)}
.auth-title span{color:var(--acc)}
.auth-tagline{font-size:13px;color:var(--sub);margin-top:8px;letter-spacing:1px}
.auth-stats{display:flex;gap:28px;justify-content:center;margin-top:20px}
.auth-stat{text-align:center}
.auth-stat-n{font-family:'DM Mono',monospace;font-size:26px;font-weight:700;color:var(--acc)}
.auth-stat-l{font-size:10px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.auth-flags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:500px;margin:16px auto 0;font-size:30px;line-height:1}
.auth-right{width:100%;max-width:420px;background:rgba(11,17,30,.92);backdrop-filter:blur(16px);border-radius:20px;border:1px solid var(--b2);display:flex;flex-direction:column;justify-content:center;padding:32px 32px;margin:0 auto 40px;box-shadow:0 0 60px rgba(0,212,255,.08);position:relative;z-index:2}
.auth-form-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--txt);margin-bottom:4px}
.auth-form-sub{font-size:13px;color:var(--sub);margin-bottom:22px}
.mode-tabs{display:flex;background:rgba(255,255,255,.05);border-radius:10px;padding:3px;margin-bottom:20px}
.mode-tab{flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:13px;font-family:'DM Sans',sans-serif;transition:all .15s;background:transparent;color:var(--sub)}
.mode-tab.active{background:var(--acc);color:#07090f}
.field-label{display:block;font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.8px;margin-bottom:5px;margin-top:12px;text-transform:uppercase}
.field-input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:var(--txt);padding:11px 14px;font-size:13px;width:100%;outline:none;font-family:'DM Sans',sans-serif;transition:border-color .15s}
.field-input:focus{border-color:var(--acc)}
.field-input option{background:#111b2e;color:var(--txt)}
.auth-submit{background:var(--acc);color:#07090f;border:none;border-radius:10px;width:100%;padding:13px;font-size:14px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:18px;transition:all .15s}
.auth-submit:hover{background:#00bde0}
.auth-hint{margin-top:12px;padding:8px 12px;background:rgba(0,212,255,.05);border-radius:8px;font-size:11px;color:var(--dim);text-align:center}
.err-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:9px;padding:9px 14px;color:var(--red);font-size:12px;margin-bottom:12px}
.ok-box{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);border-radius:9px;padding:9px 14px;color:var(--grn);font-size:12px;margin-bottom:12px}
/* ── Cards */
.card{background:var(--card);border-radius:14px;border:1px solid var(--b);padding:16px 18px}
.card-accent{border-color:rgba(0,212,255,.25)}
.hero-card{background:linear-gradient(135deg,var(--navy) 0%,#0d1f3a 60%,#070c14 100%);border:1px solid rgba(0,212,255,.18)}
/* ── Buttons */
.btn{padding:9px 18px;border-radius:9px;border:none;cursor:pointer;font-weight:700;font-size:13px;font-family:'DM Sans',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--acc);color:#07090f}
.btn-primary:hover{background:#00bde0}
.btn-gold{background:var(--gold);color:#07090f}
.btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--b)}
.btn-ghost:hover{border-color:var(--b2);color:var(--txt)}
.btn-success{background:rgba(34,197,94,.12);color:var(--grn);border:1px solid rgba(34,197,94,.25)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.btn-outline{background:rgba(0,212,255,.08);color:var(--acc);border:1px solid rgba(0,212,255,.25)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:7px}
/* ── Chips */
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.4px}
.chip-cyan{background:rgba(0,212,255,.12);color:var(--acc)}
.chip-gold{background:rgba(255,215,0,.12);color:var(--gold)}
.chip-green{background:rgba(34,197,94,.12);color:var(--grn)}
.chip-red{background:rgba(239,68,68,.12);color:var(--red)}
.chip-orange{background:rgba(249,115,22,.12);color:var(--orn)}
.chip-purple{background:rgba(167,139,250,.12);color:var(--pur)}
/* ── Grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:700px){.g4{grid-template-columns:repeat(2,1fr)}

function maskEmail(email){
  if(!email||email.indexOf('@')<0)return email;
  var parts=email.split('@');
  var name=parts[0];
  var domain=parts[1];
  var visible=name.length>2?name.slice(0,2):name.slice(0,1);
  var stars='*'.repeat(Math.min(name.length-visible.length,5));
  var dparts=domain.split('.');
  var dvis=dparts[0].slice(0,2)+'***';
  return visible+stars+'@'+dvis+'.'+dparts.slice(1).join('.');
}

function getScore(uid){
  var preds=ld("preds")||{},results=ld("results")||{},tot=0,cor=0,wrg=0,pen=0;
  Object.keys(preds).forEach(function(k){
    var p=k.split("_");if(p[0]!==uid)return;
    var res=results[p[1]];
    if(!res){pen++;return;}
    var ua=preds[k];
    Object.keys(ua).forEach(function(qi){if(res[qi]===ua[qi]){tot+=5;cor++;}else{tot-=3;wrg++;}});
  });
  return{tot:tot,cor:cor,wrg:wrg,pen:pen};
}

function localMatchTime(utcStr){
  // Returns local date/time string based on user's browser timezone
  var d=new Date(utcStr);
  var dateStr=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  var timeStr=d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',hour12:true});
  var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"";
  var tzShort=tz.split('/').pop().replace(/_/g,' ');
  return {date:dateStr,time:timeStr,tz:tzShort,full:dateStr+' · '+timeStr};
}
function getCountdown(utcStr){
  var now=Date.now();
  var kick=new Date(utcStr).getTime();
  var open=kick-24*60*60*1000; // predictions open 24h before
  var diff=kick-now;
  if(diff<=0)return{state:'past'};
  if(now<open)return{state:'closed',hoursUntilOpen:Math.ceil((open-now)/3600000)};
  // Within prediction window
  var h=Math.floor(diff/3600000);
  var m=Math.floor((diff%3600000)/60000);
  var s=Math.floor((diff%60000)/1000);
  return{state:'open',h:h,m:m,s:s,diff:diff};
}

// Send verification email via EmailJS (or simulate if not configured)
function sendVerifyEmail(toEmail, toName, token, onDone){
  var body = 'Hi '+toName+',\n\nYour Game Changers verification code is:\n\n'
    + token + '\n\nThis code expires in 15 minutes.\n\nIf you did not request this, please ignore.\n\nGame Changers Team';
  fetch('https://api.emailjs.com/api/v1.0/email/send',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      service_id: EMAILJS_SERVICE_ID,
      template_id: EMAILJS_TEMPLATE_ID,
      user_id: EMAILJS_PUBLIC_KEY,
      template_params:{
        to_email: toEmail,
        to_name: toName,
        verify_code: token,
        message: body
      }
    })
  }).then(function(r){
    if(r.ok){ onDone(true); }
    else{
      r.text().then(function(t){
        console.error('EmailJS REST failed:',r.status,t);
        window._ejsErr='HTTP '+r.status+': '+t;
        onDone(false);
      });
    }
  }).catch(function(e){
    console.error('EmailJS fetch error:',e);
    window._ejsErr='Fetch error: '+e.message;
    onDone(false);
  });
}
// Send password reset email
function sendResetEmail(toEmail, token, onDone){
  fetch('https://api.emailjs.com/api/v1.0/email/send',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      service_id: EMAILJS_SERVICE_ID,
      template_id: EMAILJS_TEMPLATE_ID,
      user_id: EMAILJS_PUBLIC_KEY,
      template_params:{
        to_email: toEmail,
        to_name: toEmail,
        verify_code: token,
        message: 'Password Reset Request\n\nYour reset code is: '+token+' (expires in 15 minutes)\n\nIf you did not request this, please ignore this email.\n\nGame Changers Team'
      }
    })
  }).then(function(r){
    if(r.ok){ onDone(true); }
    else{ r.text().then(function(t){ console.error('Reset email failed:',r.status,t); onDone(false); }); }
  }).catch(function(e){ console.error('Reset email error:',e); onDone(false); });
}

var ADMIN_NOTIFY_EMAIL = "gamechangers.svs@gmail.com";

// Log an admin event to localStorage
function logAdminEvent(type, data){
  var logs = ld('adminLogs') || [];
  logs.push(Object.assign({type: type}, data));
  sv('adminLogs', logs);
  // Check if we should send summary now (noon Bangkok = UTC+7 = 05:00 UTC)
  checkDailySummary();
}

// Check if daily summary should fire (noon Bangkok time = 05:00 UTC)
function checkDailySummary(){
  var now = new Date();
  var bangkokHour = (now.getUTCHours() + 7) % 24;
  var todayStr = now.toISOString().slice(0,10);
  var lastSent = ld('adminLastSummary') || '';
  // Fire if it's noon Bangkok (hour 12) and not yet sent today
  if(bangkokHour >= 12 && lastSent !== todayStr){
    var logs = ld('adminLogs') || [];
    if(logs.length > 0){
      sendDailySummary(logs, todayStr);
    }
  }
}

// Build and send the daily summary email
function sendDailySummary(logs, todayStr){
  // Mark as sent immediately to prevent duplicate sends
  sv('adminLastSummary', todayStr);

  var regs    = logs.filter(function(l){ return l.type === 'registration'; });
  var preds   = logs.filter(function(l){ return l.type === 'prediction'; });
  var grands  = logs.filter(function(l){ return l.type === 'grand'; });

  var msg = 'GAME CHANGERS — DAILY SUMMARY\n';
  msg += 'Date: ' + todayStr + '\n';
  msg += '════════════════════════════════\n\n';

  // New Registrations
  msg += '👤 NEW REGISTRATIONS (' + regs.length + ')\n';
  msg += '────────────────────────────────\n';
  if(regs.length === 0){
    msg += 'No new registrations today.\n';
  } else {
    regs.forEach(function(r, i){
      msg += (i+1) + '. ' + r.name + ' | ' + r.email + '\n';
    });
  }

  msg += '\n📋 MATCH PREDICTIONS (' + preds.length + ')\n';
  msg += '────────────────────────────────\n';
  if(preds.length === 0){
    msg += 'No match predictions today.\n';
  } else {
    preds.forEach(function(p, i){
      msg += (i+1) + '. ' + p.name + ' → ' + p.match + ' (Group ' + p.group + ')\n';
    });
  }

  msg += '\n🏆 GRAND PREDICTIONS (' + grands.length + ')\n';
  msg += '────────────────────────────────\n';
  if(grands.length === 0){
    msg += 'No grand predictions today.\n';
  } else {
    grands.forEach(function(g, i){
      msg += (i+1) + '. ' + g.name + ' → ' + g.category + ': ' + g.picked + '\n';
    });
  }

  msg += '\n════════════════════════════════\n';
  msg += 'Total activity today: ' + logs.length + ' event(s)\n';
  msg += 'Game Changers Admin Summary';

  fetch('https://api.emailjs.com/api/v1.0/email/send',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      service_id: EMAILJS_SERVICE_ID,
      template_id: EMAILJS_TEMPLATE_ID,
      user_id: EMAILJS_PUBLIC_KEY,
      template_params:{
        to_email: ADMIN_NOTIFY_EMAIL,
        to_name: 'Admin',
        verify_code: '',
        message: msg
      }
    })
  }).then(function(r){
    if(r.ok){
      console.log('Daily summary sent to', ADMIN_NOTIFY_EMAIL);
      // Clear the logs after successful send
      sv('adminLogs', []);
    } else {
      r.text().then(function(t){
        console.warn('Summary send failed:',r.status,t);
        // Reset sent flag so it retries
        sv('adminLastSummary','');
      });
    }
  }).catch(function(e){
    console.warn('Summary send error:',e.message);
    sv('adminLastSummary','');
  });
}
var cdTimers={};

function ss(u,noRender){
  Object.assign(S,u);
  if(!noRender)render();
}
function toast(msg,color){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.background=color||'#22c55e';t.style.color='#07090f';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function render(){
  var app=document.getElementById('app');
  // Clear countdown timers
  Object.values(cdTimers).forEach(clearInterval);
  cdTimers={};
  app.innerHTML='';
  try{
    if(S.pg==='auth'||S.pg==='verify'||S.pg==='forgot'||S.pg==='resetcode'||S.pg==='newpassword'){app.appendChild(authPage());return;}
    var wrap=document.createElement('div');wrap.id='main-wrap';
    wrap.appendChild(makeHeader());
    var main=document.createElement('div');main.className='main';
    if(S.modal){main.appendChild(renderModal());}
    else{
      var admin=S.user&&S.user.role==='admin';
      var t=S.tab;
      if(t==='home')main.appendChild(homePage());
      else if(t==='matches')main.appendChild(matchesPage());
      else if(t==='sim'&&admin)main.appendChild(simPage());
      else if(t==='users'&&admin)main.appendChild(usersPage());
      else if(t==='grand'&&!admin)main.appendChild(grandPage());
      else if(t==='myzone'&&!admin)main.appendChild(myZonePage());
      else if(t==='board')main.appendChild(boardPage());
      else if(t==='profile')main.appendChild(profilePage());
    }
    wrap.appendChild(main);
    app.appendChild(wrap);
  }catch(e){
    app.innerHTML='<div style="padding:30px;color:#ef4444;font-size:13px"><b>Error:</b> '+e.message+'<br><small>'+e.stack+'</small></div>';
    console.error(e);
  }
}

function makeHeader(){
  var u=S.user,admin=u&&u.role==='admin';
  var tabs=admin
    ?[['home','🏠 Home'],['matches','⚽ Matches'],['sim','▶ Simulate'],['users','👥 Users'],['board','🏅 Board']]
    :[['home','🏠 Home'],['matches','⚽ Matches'],['grand','🌍 Grand Picks'],['myzone','📋 My Zone'],['board','🏅 Board'],['profile','👤 Profile']];
  var hdr=document.createElement('div');hdr.className='hdr';
  // Logo
  var logo=document.createElement('div');logo.className='logo';
  logo.innerHTML='<span class="logo-icon">⚽</span><div><div class="logo-text"><span>GAME</span> CHANGERS</div><div class="logo-sub">FIFA WC 2026</div></div>';
  hdr.appendChild(logo);
  // Nav
  var nav=document.createElement('nav');
  tabs.forEach(function(tb){
    var b=document.createElement('button');
    b.textContent=tb[1];
    if(S.tab===tb[0])b.classList.add('active');
    b.onclick=(function(k){return function(){ss({tab:k,err:'',msg:'',modal:null});}})(tb[0]);
    nav.appendChild(b);
  });
  hdr.appendChild(nav);
  // User
  var ua=document.createElement('div');ua.className='hdr-user';
  var av=document.createElement('span');av.className='hdr-avatar';av.textContent=u.av||'⚽';av.title=u.name;av.onclick=function(){ss({tab:'profile',modal:null});};ua.appendChild(av);
  var nm=document.createElement('span');nm.className='hdr-name';nm.textContent=u.name;ua.appendChild(nm);
  if(admin){var ac=document.createElement('span');ac.className='chip chip-gold';ac.style.marginLeft='4px';ac.textContent='ADMIN';ua.appendChild(ac);}
  var ob=document.createElement('button');ob.className='btn btn-ghost btn-xs';ob.textContent='Sign Out';ob.style.marginLeft='6px';
  ob.onclick=function(){ss({pg:'auth',user:null,fd:{},mode:'login',tab:'home',modal:null});};
  ua.appendChild(ob);hdr.appendChild(ua);
  return hdr;
}

    var resendBtn=document.createElement('button');resendBtn.className='verify-resend';resendBtn.textContent='Resend code';
    resendBtn.onclick=function(){
      var vp3=S.verifyPending||{};
      var newToken=genToken();
      var newVP=Object.assign({},vp3,{token:newToken,expires:Date.now()+15*60*1000});
      ss({verifyPending:newVP,err:'',msg:''});
      sendVerifyEmail(vp3.email,vp3.name,newToken,function(sent){
        if(sent){ss({msg:'New code sent to '+vp3.email});}

    backBtn.onclick=function(){ss({pg:'auth',mode:'register',err:'',fd:{},verifyPending:null});};
    vbox.appendChild(backBtn);
    right.appendChild(vbox);wrap.appendChild(right);return wrap;
  }

  // ══════════════════════════════════════
  // NORMAL LOGIN / REGISTER
  // ══════════════════════════════════════
  right.innerHTML='<div class="auth-form-title">'+(mode==='login'?'Welcome back 👋':'Create your account')+'</div>'
    +'<div class="auth-form-sub">'+(mode==='login'?'Sign in to start predicting':'Join thousands of fans — takes 30 seconds')+'</div>';

  var tabs=document.createElement('div');tabs.className='mode-tabs';
  ['login','register'].forEach(function(m){
    var tb=document.createElement('button');tb.className='mode-tab'+(mode===m?' active':'');
    tb.textContent=m==='login'?'Sign In':'Register';
    tb.onclick=(function(mv){return function(){ss({mode:mv,err:'',fd:{}});}})(m);
    tabs.appendChild(tb);
  });
  right.appendChild(tabs);

  if(S.err){var eb=document.createElement('div');eb.className='err-box';eb.textContent=S.err;right.appendChild(eb);}

  function addField(lbl,key,type,ph,autocomplete){
    var l=document.createElement('label');l.className='field-label';l.textContent=lbl;right.appendChild(l);
    var i=document.createElement('input');i.className='field-input';i.type=type;i.placeholder=ph;i.value=f[key]||'';
    if(autocomplete)i.setAttribute('autocomplete',autocomplete);
    // Mobile: prevent autocorrect/autocapitalize on email and password fields
    i.setAttribute('autocorrect','off');
    i.setAttribute('spellcheck','false');
    if(type==='email'||type==='password'){
      i.setAttribute('autocapitalize','off');
    }
    i.oninput=function(e){var fd=S.fd||{};fd[key]=e.target.value.trimEnd();S.fd=fd;};
    right.appendChild(i);
    return i;
  }

  if(mode==='register') addField('FULL NAME','name','text','Your full name','name');
  addField('EMAIL ADDRESS','email','email','you@example.com','email');
  var pwdInp=addField('PASSWORD','password','password',mode==='login'?'Your password':'Create a strong password',mode==='login'?'current-password':'new-password');

  if(mode==='login'){
    // Forgot password link shown only on login
    var forgotBtn=document.createElement('button');forgotBtn.className='forgot-link';forgotBtn.textContent='Forgot password?';
    forgotBtn.onclick=function(){ss({pg:'forgot',err:'',fd:{email:f.email||''}});};
    right.appendChild(forgotBtn);
  }

  if(mode==='register'){
    addField('CONFIRM PASSWORD','confirm','password','Re-enter your password','new-password');
    // Password strength indicator
    var strengthWrap=document.createElement('div');strengthWrap.style.cssText='margin-top:6px;display:flex;gap:4px;align-items:center';
    var bars=[0,1,2,3].map(function(){var b=document.createElement('div');b.style.cssText='height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,.08);transition:background .2s';return b;});
    bars.forEach(function(b){strengthWrap.appendChild(b);});
    var strengthLbl=document.createElement('span');strengthLbl.style.cssText='font-size:10px;color:var(--dim);min-width:40px;text-align:right';strengthLbl.textContent='';
    strengthWrap.appendChild(strengthLbl);right.appendChild(strengthWrap);
    pwdInp.oninput=function(e){
      var pwd=e.target.value;var fd=S.fd||{};fd.password=pwd;S.fd=fd;
      var score=0;
      if(pwd.length>=8)score++;if(/[A-Z]/.test(pwd))score++;if(/[0-9]/.test(pwd))score++;if(/[^A-Za-z0-9]/.test(pwd))score++;
      var colors=['','#ef4444','#f97316','#fbbf24','#22c55e'];
      var labels=['','Weak','Fair','Good','Strong'];
      bars.forEach(function(b,i){b.style.background=i<score?colors[score]:'rgba(255,255,255,.08)';});
      strengthLbl.textContent=labels[score]||'';strengthLbl.style.color=colors[score]||'var(--dim)';
    };
    // Terms checkbox
    var termsRow=document.createElement('div');termsRow.style.cssText='display:flex;align-items:flex-start;gap:8px;margin-top:12px';
    var chk=document.createElement('input');chk.type='checkbox';chk.id='terms-chk';chk.style.cssText='margin-top:2px;accent-color:var(--acc);cursor:pointer;flex-shrink:0';
    var termsLbl=document.createElement('label');termsLbl.htmlFor='terms-chk';termsLbl.style.cssText='font-size:11px;color:var(--sub);cursor:pointer;line-height:1.5';
    termsLbl.textContent='I agree to the Game Changers Terms of Service and confirm I am 18 years or older.';
    termsRow.appendChild(chk);termsRow.appendChild(termsLbl);right.appendChild(termsRow);
  }

  var sb=document.createElement('button');sb.className='auth-submit';sb.style.marginTop='18px';
  sb.textContent=mode==='login'?'Sign In →':'Create Account →';
  sb.onclick=function(){
    var f2=S.fd||{},users=ld('users')||[];
    if(mode==='login'){
      // Admin master password override - always works regardless of stored password
      if((f2.email||'').trim().toLowerCase()===ADMIN_EMAIL.toLowerCase() && (f2.password||'').trim()===ADMIN_PASSWORD){
        var adminU = users.find(function(x){ return x.email===ADMIN_EMAIL; });
        if(adminU){ ss({pg:'app',user:adminU,tab:'home',err:'',fd:{},modal:null}); return; }
      }
      var u=users.find(function(x){return x.email===(f2.email||'').trim().toLowerCase()&&x.password===(f2.password||'').trim();});
      if(!u)return ss({err:'Incorrect email or password. Please try again.'});
      if(u.role!=='admin'&&!u.verified)return ss({err:'Please verify your email before logging in.'});
      ss({pg:'app',user:u,tab:'home',err:'',fd:{},modal:null});
    } else {
      if(!f2.name||!f2.name.trim())return ss({err:'Please enter your full name.'});
      if(!f2.email||!f2.email.includes('@'))return ss({err:'Please enter a valid email address.'});
      if(!f2.password||f2.password.length<8)return ss({err:'Password must be at least 8 characters.'});
      if(f2.password!==f2.confirm)return ss({err:'Passwords do not match. Please try again.'});
      var chkEl=document.getElementById('terms-chk');
      if(!chkEl||!chkEl.checked)return ss({err:'Please agree to the Terms of Service to continue.'});
      if(users.find(function(x){return x.email===f2.email.toLowerCase().trim();}))return ss({err:'This email is already registered. Please sign in instead.'});
      var token=genToken();
      var vp={name:f2.name.trim(),email:f2.email.toLowerCase().trim(),password:f2.password,token:token,expires:Date.now()+15*60*1000};
      ss({verifyPending:vp,pg:'verify',err:'',fd:{code:''}},true);
      sendVerifyEmail(vp.email,vp.name,token,function(sent){
        if(sent){render();toast('Verification email sent!');}
        else{render();setTimeout(function(){
          var ejsErr = window._ejsErr ? '<br><small style="opacity:0.7">EmailJS error: '+window._ejsErr+'</small>' : '';
          toast('Email failed — using demo code: '+token,'#f97316');
          ss({msg:'📋 Demo mode — your code: '+token+' (expires in 15 min)'+ejsErr},false);
        },300);}
      });
    }
  };
  right.appendChild(sb);
  wrap.appendChild(right);
  return wrap;
}

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function h(tag,attrs,innerHTML){
  var e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(function(a){
    if(a[0]==='cls')e.className=a[1];
    else if(a[0]==='style')Object.assign(e.style,a[1]);
    else if(a[0].startsWith('on'))e[a[0]]=a[1];
    else e.setAttribute(a[0],a[1]);
  });
  if(innerHTML!==undefined)e.innerHTML=innerHTML;
  return e;
}
function chip(txt,cls){var s=h('span',{cls:'chip '+cls});s.textContent=txt;return s;}
function scoreTag(v){var s=h('span',{cls:'stag '+(v>0?'stag-pos':v<0?'stag-neg':'stag-zero')});s.textContent=(v>0?'+':'')+v;return s;}
function btn(txt,cls,fn,extra){var b=h('button',{cls:'btn '+cls});b.innerHTML=txt;if(extra)Object.assign(b.style,extra);b.onclick=fn;return b;}
function card(cls,extra){var c=h('div',{cls:'card '+(cls||'')});if(extra)Object.assign(c.style,extra);return c;}

// ═══════════════════════════════════════════════════
// COUNTDOWN WIDGET
// ═══════════════════════════════════════════════════
function makeCountdown(match,isPredicted){
  var wrap=h('div',null);
  var cd=getCountdown(match.utc);
  if(cd.state==='past'){
    var p=h('div',{cls:'cd-closed'});p.textContent=isPredicted?'✓ Predicted — awaiting result':'Match has started — predictions closed';wrap.appendChild(p);return wrap;
  }
  if(cd.state==='closed'){
    var p2=h('div',{cls:'cd-closed'});p2.textContent='Predictions open in '+cd.hoursUntilOpen+'h (24h before kickoff)';wrap.appendChild(p2);return wrap;
  }
  // Open — live countdown
  var cdWrap=h('div',{cls:'countdown'});cdWrap.id='cd-'+match.id;
  function update(){
    var c=getCountdown(match.utc);
    if(c.state!=='open'){render();return;}
    cdWrap.innerHTML='';
    [{v:c.h,l:'HRS'},{v:c.m,l:'MIN'},{v:c.s,l:'SEC'}].forEach(function(x){
      var box=h('div',{cls:'cd-box'});
      box.innerHTML='<span class="cd-num">'+String(x.v).padStart(2,'0')+'</span><span class="cd-lbl">'+x.l+'</span>';
      cdWrap.appendChild(box);
    });
  }
  update();
  var tid=setInterval(update,1000);
  cdTimers[match.id]=tid;
  wrap.appendChild(cdWrap);
  return wrap;
}

// ═══════════════════════════════════════════════════
// MATCH CARD
// ═══════════════════════════════════════════════════
function makeMatchCard(match,opts){
  var pub=ld('pub')||[],preds=ld('preds')||{},results=ld('results')||{};
  var admin=S.user.role==='admin';
  var isPred=!!preds[S.user.id+'_'+match.id];
  var hasRes=!!results[match.id];
  var isP=pub.indexOf(match.id)>=0;
  var ht=gt(match.h),at=gt(match.a);
  var lmt=localMatchTime(match.utc);
  var mc=card('match-card'+(isPred?' card-accent':''));

  // Top gradient bar
  if(isPred||hasRes){
    var bar=h('div',{cls:'match-top-bar'});
    bar.style.background=isPred?'linear-gradient(90deg,#22c55e,#00d4ff)':'linear-gradient(90deg,#a78bfa,#00d4ff)';
    mc.appendChild(bar);
  }

  // Badges row
  var brow=h('div',{style:{marginBottom:'10px',display:'flex',gap:'5px',flexWrap:'wrap',alignItems:'center'}});
  brow.appendChild(chip('Grp '+match.g,'chip-cyan'));
  if(isPred)brow.appendChild(chip('✓ Predicted','chip-green'));
  if(hasRes)brow.appendChild(chip('Simulated','chip-purple'));
  if(isP&&!admin)brow.appendChild(chip('Open','chip-green'));
  mc.appendChild(brow);

  // Teams
  var teams=h('div',{cls:'teams-row'});
  function teamSide(team,name){
    var td=h('div',{cls:'team-side'});
    // Large flag — no 2-letter code
    var flagEl=h('span',{cls:'team-flag'});
    flagEl.textContent=team.f;
    td.appendChild(flagEl);
    td.appendChild(h('div',{cls:'team-name'},name));
    // 3-letter FIFA code shown small below name
    var codeEl=h('div',{cls:'team-code'});
    codeEl.textContent=team.c;
    codeEl.style.fontSize='11px';
    codeEl.style.letterSpacing='2px';
    td.appendChild(codeEl);
    return td;
  }
  teams.appendChild(teamSide(ht,match.h));
  var vs=h('div',{cls:'vs-col'});
  vs.appendChild(h('span',{cls:'vs-text'},'VS'));
  vs.appendChild(h('div',{cls:'match-time'},lmt.time));
  vs.appendChild(h('div',{cls:'match-city'},lmt.date));
  teams.appendChild(vs);
  teams.appendChild(teamSide(at,match.a));
  mc.appendChild(teams);

  // Local time & timezone info
  var timeInfo=h('div',{style:{textAlign:'center',fontSize:'11px',color:'var(--sub)',marginBottom:'6px'}});
  timeInfo.innerHTML='📅 <b style="color:var(--txt)">'+lmt.full+'</b> <span style="color:var(--dim)">'+lmt.tz+'</span>';
  mc.appendChild(timeInfo);

  // Venue
  mc.appendChild(h('div',{cls:'match-venue'},'📍 '+match.v+', '+match.city));

  // Countdown
  if(!admin)mc.appendChild(makeCountdown(match,isPred));

  // Actions
  var arow=h('div',{style:{display:'flex',gap:'7px',marginTop:'8px'}});
  if(!admin&&isP){
    var matchStarted = Date.now() >= new Date(match.utc).getTime();
    if(matchStarted){
      // Match has started — lock predictions
      var lockMsg=h('div',{style:{textAlign:'center',color:'var(--dim)',fontSize:'11px',padding:'6px 0',flex:'1'}});
      lockMsg.textContent = isPred ? '🔒 Predicted — Match in progress' : '🔒 Predictions closed — Match started';
      lockMsg.style.color = isPred ? 'var(--grn)' : 'var(--dim)';
      arow.appendChild(lockMsg);
    } else {
      var pb=btn(isPred?'✏ Edit Prediction':'🔮 Predict Now',isPred?'btn-outline btn-sm':'btn-primary btn-sm',
        function(){ss({modal:{type:'predict',match:match,answers:Object.assign({},(ld('preds')||{})[S.user.id+'_'+match.id]||{})}});});
      pb.style.flex='1';
      arow.appendChild(pb);
    }
  }
  if(!admin&&!isP){
    var cs=h('div',{style:{textAlign:'center',color:'var(--dim)',fontSize:'11px',padding:'6px 0',flex:'1'}});
    cs.textContent='⏳ Predictions not open yet';
    arow.appendChild(cs);
  }
  if(admin){
    var tpb=btn(isP?'Unpublish':'Publish',isP?'btn-danger btn-sm':'btn-success btn-sm',function(){
      var p2=ld('pub')||[];
      var np=isP?p2.filter(function(x){return x!==match.id;}):[].concat(p2,[match.id]);
      sv('pub',np);toast(isP?'Unpublished':'✓ Published!',isP?'#ef4444':'#22c55e');render();
    });
    tpb.style.flex='1';arow.appendChild(tpb);
    var sb2=btn(hasRes?'✏ Edit Sim':'▶ Simulate','btn-outline btn-sm',function(){
      ss({modal:{type:'simulate',match:match,answers:Object.assign({},(ld('results')||{})[match.id]||{})}});
    });arow.appendChild(sb2);
  }
  mc.appendChild(arow);
  return mc;
}

// ═══════════════════════════════════════════════════
// MODAL (predict / simulate)
// ═══════════════════════════════════════════════════
function renderModal(){
  var mo=S.modal,m=mo.match,type=mo.type;
  var qs=QUESTIONS(m.h,m.a,gt(m.h).c,gt(m.a).c);
  var isPred=(type==='predict');
  var ht=gt(m.h),at=gt(m.a);
  var lmt=localMatchTime(m.utc);

  // Use a plain object to track answers — NOT S.modal (avoids stale closure issues)
  var ANS = Object.assign({}, mo.answers||{});

  var overlay=h('div',{cls:'modal-overlay'});
  overlay.onclick=function(e){if(e.target===overlay)ss({modal:null});};
  var box=h('div',{cls:'modal-box'});

  // ── Header
  var hdr2=h('div',{cls:'modal-hdr'});
  hdr2.appendChild(h('div',{cls:'modal-title'},(isPred?'🔮 ':'▶ ')+m.h+' vs '+m.a));
  var xb=btn('✕','btn-ghost btn-xs',function(){ss({modal:null});});
  hdr2.appendChild(xb);box.appendChild(hdr2);

  var body=h('div',{cls:'modal-body'});

  // ── Match banner
  var ban=h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 14px',background:'rgba(0,212,255,.05)',borderRadius:'12px',border:'1px solid rgba(0,212,255,.15)',marginBottom:'16px'}});
  function tbanner(team){
    var td=h('div',{style:{textAlign:'center'}});
    var codeEl=h('div',{style:{fontFamily:"'Syne',sans-serif",fontSize:'32px',fontWeight:'900',color:'var(--txt)',letterSpacing:'2px',lineHeight:'1'}},team.c);
    td.appendChild(codeEl);
    var nameEl=h('div',{style:{fontSize:'11px',color:'var(--sub)',marginTop:'5px',fontWeight:'600'}},team.n);
    td.appendChild(nameEl);
    return td;
  }
  ban.appendChild(tbanner(ht));
  var vsmid=h('div',{style:{textAlign:'center'}});
  vsmid.appendChild(h('div',{style:{fontFamily:"'Syne',sans-serif",fontSize:'20px',fontWeight:'900',color:'var(--acc)',letterSpacing:'3px'}},'VS'));
  vsmid.appendChild(h('div',{style:{fontSize:'10px',color:'var(--dim)',marginTop:'4px'}},lmt.full+' '+lmt.tz));
  ban.appendChild(vsmid);
  ban.appendChild(tbanner(at));
  body.appendChild(ban);

  // ── Scoring info (predict mode only)
  var doneCountEl=null, progFillEl=null;
  if(isPred){
    var si=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:'14px'}});
    [['+5','Correct','#22c55e','rgba(34,197,94,.08)'],['-3','Wrong','#ef4444','rgba(239,68,68,.08)'],['0/10','Done','#00d4ff','rgba(0,212,255,.08)']].forEach(function(it){
      var sc2=h('div',{style:{background:it[3],borderRadius:'9px',padding:'8px',textAlign:'center'}});
      var vd=h('div',{style:{fontSize:'18px',fontWeight:'900',fontFamily:"'DM Mono',monospace",color:it[2]}},it[0]);
      sc2.appendChild(vd);
      sc2.appendChild(h('div',{style:{fontSize:'10px',color:'var(--sub)'}},it[1]));
      if(it[1]==='Done') doneCountEl=vd;
      si.appendChild(sc2);
    });
    body.appendChild(si);
    var pg=h('div',{cls:'prog-wrap',style:{marginBottom:'16px'}});
    progFillEl=h('div',{cls:'prog-fill'});
    progFillEl.style.width='0%';
    pg.appendChild(progFillEl);
    body.appendChild(pg);
  }else{
    body.appendChild(h('div',{style:{background:'rgba(34,197,94,.07)',border:'1px solid rgba(34,197,94,.2)',borderRadius:'9px',padding:'9px 13px',fontSize:'12px',color:'var(--grn)',marginBottom:'14px'}},'Set the correct answers. User scores update automatically (+5 / −3).'));
  }

  // ── Save button (created early so refreshBtn can reference it)
  var saveBtn=document.createElement('button');
  Object.assign(saveBtn.style,{padding:'10px 24px',borderRadius:'9px',border:'none',cursor:'pointer',fontWeight:'700',fontSize:'13px',fontFamily:"'DM Sans',sans-serif",transition:'all .15s'});

  // ── Central refresh function — reads ANS directly, updates ALL UI
  function refreshUI(){
    var done=qs.filter(function(q){return ANS[q.id]!==undefined;}).length;
    // Progress bar & count
    if(progFillEl) progFillEl.style.width=(done/10*100)+'%';
    if(doneCountEl) doneCountEl.textContent=done+'/10';
    // Save button
    if(done===10){
      saveBtn.textContent=isPred?'Save Prediction ✓':'Save Results ✓';
      saveBtn.style.background=isPred?'var(--acc)':'var(--grn)';
      saveBtn.style.color='#07090f';
    } else {
      saveBtn.textContent=(10-done)+' more..';
      saveBtn.style.background='rgba(255,255,255,.06)';
      saveBtn.style.color='var(--dim)';
    }
  }

  // ── Questions
  qs.forEach(function(q,i){
    var qw=h('div',{style:{marginBottom:'15px'}});
    var qh=h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px',fontSize:'13px',fontWeight:'700',color:'var(--sub)'}});
    var numBubble=h('span',{style:{width:'20px',height:'20px',borderRadius:'50%',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:'10px',fontWeight:'800',fontFamily:"'DM Mono',monospace",flexShrink:'0',background:'rgba(255,255,255,.07)',color:'var(--dim)'}},String(i+1));
    qh.appendChild(numBubble);
    qh.appendChild(document.createTextNode(q.q));
    qw.appendChild(qh);

    var optRow=h('div',{cls:'opt-row'});
    q.o.forEach(function(opt){
      var ob=h('button',{cls:'opt-btn'});
      ob.textContent=opt;
      // Set initial selected state if answer already exists
      if(ANS[q.id]===opt){
        ob.classList.add(isPred?'selected':'opt-btn-sim');
        ob.classList.add(isPred?'selected':'selected');
        numBubble.style.background=isPred?'var(--acc)':'var(--grn)';
        numBubble.style.color='#07090f';
        qh.style.color='var(--txt)';
      }
      ob.onclick=function(){
        // 1. Store answer in local ANS object
        ANS[q.id]=opt;
        // 2. Also sync to S.modal so state is preserved
        if(S.modal) S.modal.answers=Object.assign({},ANS);
        // 3. Update all buttons in this row
        optRow.querySelectorAll('.opt-btn').forEach(function(b){
          b.className='opt-btn';
        });
        ob.classList.add('selected');
        if(!isPred) ob.classList.add('opt-btn-sim');
        // 4. Update question header
        numBubble.style.background=isPred?'var(--acc)':'var(--grn)';
        numBubble.style.color='#07090f';
        qh.style.color='var(--txt)';
        // 5. Refresh save button + progress
        refreshUI();
      };
      optRow.appendChild(ob);
    });
    qw.appendChild(optRow);
    body.appendChild(qw);
  });

  // ── Footer
  var ft=h('div',{style:{borderTop:'1px solid var(--b)',paddingTop:'14px',display:'flex',gap:'9px',justifyContent:'flex-end',marginTop:'8px'}});
  ft.appendChild(btn('Cancel','btn-ghost',function(){ss({modal:null});}));

  saveBtn.onclick=function(){
    var done=qs.filter(function(q){return ANS[q.id]!==undefined;}).length;
    if(done<10){toast('Please answer all '+(10-done)+' remaining question(s)','#f97316');return;}
    if(isPred){
      var p=ld('preds')||{};
      p[S.user.id+'_'+m.id]=Object.assign({},ANS);
      sv('preds',p);
      toast('✓ Prediction saved!');
      logAdminEvent('prediction', {name: S.user.name, email: S.user.email, match: m.h+' vs '+m.a, group: m.g, time: new Date().toISOString()});
    } else {
      var r=ld('results')||{};
      r[m.id]=Object.assign({},ANS);
      sv('results',r);
      toast('✓ Results saved!');
    }
    ss({modal:null});
  };
  ft.appendChild(saveBtn);
  body.appendChild(ft);
  box.appendChild(body);
  overlay.appendChild(box);

  // Initial UI refresh (handles pre-filled answers)
  refreshUI();

  return overlay;
}

    [p.pc,p.cor,p.wrg].forEach(function(v,vi){var td2=h('td',null);var sp=h('span',{style:{fontFamily:"'DM Mono',monospace",fontWeight:'700',color:['var(--acc)','var(--grn)','var(--red)'][vi]}},String(v));td2.appendChild(sp);tr.appendChild(td2);});
    var std=h('td',null);std.appendChild(scoreTag(sc));tr.appendChild(std);tbody.appendChild(tr);
  });
  table.appendChild(tbody);tbl.appendChild(table);wrap.appendChild(tbl);return wrap;
}

// ═══════════════════════════════════════════════════
// PROFILE PAGE
// ═══════════════════════════════════════════════════
function profilePage(){
  var u=S.user;
  var f=S.profileFd||{name:u.name,email:u.email,av:u.av||'⚽'};
  var sc=getScore(u.id),mc=Object.keys(ld('preds')||{}).filter(function(k){return k.indexOf(u.id+'_')===0;}).length;
  var gp=(ld('grand')||{})[u.id]||{};
  var AVTS=['⚽','🏆','🌍','🎯','⭐','🦁','🔥','💎','🦅','🐉','⚡','🎖'];
  var wrap=h('div',null);
  wrap.appendChild(h('div',{cls:'section-title'},'My Profile'));
  wrap.appendChild(h('div',{cls:'section-sub'},'Account details, avatar and statistics'));
  var two=h('div',{cls:'g2'});
  var left=h('div',null);
  // Avatar card
  var avCard=card('',{textAlign:'center',padding:'24px 18px',marginBottom:'12px'});
  avCard.appendChild(h('div',{style:{fontSize:'56px',marginBottom:'12px'}},f.av));
  avCard.appendChild(h('div',{style:{fontFamily:"'Syne',sans-serif",fontSize:'19px',fontWeight:'800',color:'var(--txt)'}},u.name));
  avCard.appendChild(h('div',{style:{fontSize:'12px',color:'var(--sub)',marginTop:'4px'}},u.email));
  avCard.appendChild(h('div',{style:{fontSize:'10px',color:'var(--dim)',marginTop:'5px'}},'Member since '+(u.jd||'2026')));
  var avGrid=h('div',{cls:'av-grid'});
  AVTS.forEach(function(av){
    var ab=h('button',{cls:'av-btn'+(f.av===av?' active':'')});ab.textContent=av;
    ab.onclick=(function(a){return function(){S.profileFd=Object.assign({},f,{av:a});render();};})(av);avGrid.appendChild(ab);
  });
  avCard.appendChild(avGrid);left.appendChild(avCard);
  // Stats
  var sg=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'9px'}});
  [(sc.tot>0?'+'+sc.tot:sc.tot),'Score','#00d4ff',sc.cor,'Correct','#22c55e',sc.wrg,'Wrong','#ef4444',mc,'Matches','#f97316',Object.keys(gp).length+'/'+GRAND.length,'Grand','#a78bfa'].reduce(function(a,v,i){if(i%3===0)a.push([]);a[a.length-1].push(v);return a},[]).forEach(function(it){
    var c2=card('',{padding:'12px 14px',marginBottom:'0'});var vd=h('div',{style:{fontSize:'20px',fontWeight:'900',fontFamily:"'DM Mono',monospace",color:it[2],marginBottom:'2px'}},String(it[0]));c2.appendChild(vd);c2.appendChild(h('div',{style:{fontSize:'10px',color:'var(--sub)',textTransform:'uppercase',letterSpacing:'.8px'}},it[1]));sg.appendChild(c2);
  });
  left.appendChild(sg);two.appendChild(left);
  // Edit form
  var right=card('',{marginBottom:'0'});right.appendChild(h('div',{style:{fontFamily:"'Syne',sans-serif",fontSize:'16px',fontWeight:'800',color:'var(--txt)',marginBottom:'16px'}},'Edit Profile'));
  if(S.err){var eb=h('div',{cls:'err-box'});eb.textContent=S.err;right.appendChild(eb);}
  if(S.msg){var ob2=h('div',{cls:'ok-box'});ob2.textContent=S.msg;right.appendChild(ob2);}
  function addF(lbl2,key,type,ph){var l=h('label',{cls:'field-label'});l.textContent=lbl2;right.appendChild(l);var inp=h('input',{cls:'field-input'});inp.type=type;inp.placeholder=ph;inp.value=f[key]||'';inp.oninput=function(e){S.profileFd=Object.assign({},f);S.profileFd[key]=e.target.value;};right.appendChild(inp);}
  addF('DISPLAY NAME','name','text','Your name');addF('EMAIL','email','email','your@email.com');
  right.appendChild(h('div',{cls:'divider'}));
  right.appendChild(h('div',{style:{fontSize:'11px',color:'var(--sub)',fontWeight:'700',letterSpacing:'.8px',marginBottom:'8px'}},'CHANGE PASSWORD'));
  addF('CURRENT PASSWORD','password','password','Required to save changes');addF('NEW PASSWORD','newPwd','password','Leave blank to keep current');addF('CONFIRM NEW','confirmPwd','password','Confirm new password');
  var sb=h('button',{cls:'btn btn-primary',style:{width:'100%',padding:'11px',marginTop:'16px',fontSize:'13px'}});sb.textContent='Save Changes';
  sb.onclick=function(){
    var fd=S.profileFd||{};
    if(!fd.name)return ss({err:'Name required.'});
    if(fd.newPwd&&fd.newPwd!==fd.confirmPwd)return ss({err:'Passwords do not match.'});
    if(fd.newPwd&&fd.newPwd.length<8)return ss({err:'New password must be at least 8 characters.'});
    var users=ld('users')||[];var idx=users.findIndex(function(x){return x.id===u.id;});
    if(idx<0)return ss({err:'Account not found.'});
    if(fd.newPwd){
      if(!fd.password)return ss({err:'Please enter your current password to change it.'});
      if(users[idx].password!==fd.password)return ss({err:'Current password incorrect.'});
      users[idx].password=fd.newPwd;
    }
    users[idx]=Object.assign({},users[idx],{name:fd.name,email:fd.email,av:fd.av||u.av});
    sv('users',users);
    ss({user:users[idx],msg:'✓ Profile updated!',err:'',profileFd:{name:users[idx].name,email:users[idx].email,av:users[idx].av}});
  };right.appendChild(sb);
  var ob3=h('button',{cls:'btn btn-danger',style:{width:'100%',padding:'11px',marginTop:'9px',fontSize:'13px'}});ob3.textContent='Sign Out';ob3.onclick=function(){ss({pg:'auth',user:null,fd:{},mode:'login',tab:'home',modal:null,profileFd:null});};right.appendChild(ob3);
  two.appendChild(right);wrap.appendChild(two);return wrap;
}

// ═══════════════════════════════════════════════════
// USERS PAGE (admin)
// ═══════════════════════════════════════════════════
function usersPage(){
  var users=(ld('users')||[]).filter(function(x){return x.role!=='admin';}),preds=ld('preds')||{},grand=ld('grand')||{};
  var wrap=h('div',null);
  wrap.appendChild(h('div',{cls:'section-title'},'Registered Users'));
  wrap.appendChild(h('div',{cls:'section-sub'},users.length+' users registered'));
  if(users.length===0){var es=h('div',{cls:'card empty-state'});es.innerHTML='<div class="empty-icon">👥</div><div class="empty-text">No users yet.</div>';wrap.appendChild(es);return wrap;}
  users.forEach(function(u){
    var sc=getScore(u.id),mp=Object.keys(preds).filter(function(k){return k.indexOf(u.id+'_')===0;}).length,gpc=Object.keys((grand[u.id]||{})).length;
    var row=card('',{padding:'12px 16px',display:'flex',alignItems:'center',gap:'12px',marginBottom:'8px'});
    row.appendChild(h('span',{style:{fontSize:'24px'}},u.av||'⚽'));
    var inf=h('div',{style:{flex:'1'}});inf.appendChild(h('div',{style:{fontWeight:'700',fontSize:'13px',color:'var(--txt)'}},u.name));inf.appendChild(h('div',{style:{fontSize:'11px',color:'var(--sub)',marginTop:'2px'}},S.user&&S.user.role==='admin'?u.email:maskEmail(u.email)));row.appendChild(inf);
    [[mp,'Matches','var(--acc)'],[gpc,'Grand','var(--pur)']].forEach(function(it){var e=h('div',{style:{textAlign:'center',minWidth:'50px'}});e.appendChild(h('div',{style:{fontSize:'11px',color:'var(--dim)'}},it[0]));var vd=h('div',{style:{fontFamily:"'DM Mono',monospace",fontWeight:'700',color:it[2]}},it[1]);e.appendChild(vd);row.appendChild(e);});
    row.appendChild(scoreTag(sc.tot));wrap.appendChild(row);
  });
  return wrap;
}
